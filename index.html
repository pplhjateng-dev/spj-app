<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Penyusun SPJ Perjalanan Dinas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
/* VOICE  work: alat kerja internal untuk staf keuangan, tenang dan presisi
   IDEA   meja kerja bendahara: formulir isian di kiri, berkas SPJ asli (kertas A4/F4) di kanan
   PICTURE dokumen SPJ yang tersusun hidup, lembar demi lembar, berubah saat form diisi
   COLOUR putih, tinta #121212, slate #2e6f8e (utama), merah #c8102e (wajib kosong), amber #a35f00 (peringatan)
   TYPE   Source Serif 4 600 judul + Inter teks; dokumen pakai Arial seperti berkas dinas
   LAYOUT laptop: form 44% kiri, pratinjau lengket di kanan; ponsel: tab Form / Pratinjau, total tetap terlihat */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#10191e);--panel:light-dark(#eef3f6,#17242b);--line:light-dark(#cfdae1,#2c3d47);
--ink:light-dark(#121212,#e8eef1);--mute:light-dark(#4f5d66,#9fb0ba);--pri:light-dark(#2e6f8e,#6fb3d4);--pri-ink:#fff;
--err:light-dark(#c8102e,#ff6b7d);--err-bg:light-dark(#fdecef,#3a1820);--warn:light-dark(#a35f00,#f0b24a);--warn-bg:light-dark(#fff4dc,#3a2c12);
--ok:light-dark(#1d7a46,#5fd08f);--ok-bg:light-dark(#e6f4ec,#14301f);--field:light-dark(#fff,#0d151a);--desk:light-dark(#dfe6ea,#0a1013)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.gut{padding-left:max(2.5vw,16px,env(safe-area-inset-left,0px));padding-right:max(2.5vw,16px,env(safe-area-inset-right,0px))}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:10px}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
h1{font:600 clamp(22px,2.4vw,30px)/1.1 "Source Serif 4",Georgia,serif;letter-spacing:-.02em;margin:0;flex:1 1 260px}
h1 small{display:block;font:400 13px/1.4 Inter,sans-serif;color:var(--mute);letter-spacing:0;margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--panel)}
.seg button{border:0;background:none;padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;white-space:nowrap;min-height:40px}
.seg button[aria-pressed=true]{background:var(--pri);color:var(--pri-ink)}
.tot{text-align:right;flex:0 1 auto}
.tot b{display:block;font:700 clamp(20px,2.2vw,26px)/1.1 Inter,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.tot span{font-size:13px;color:var(--mute);display:block;max-width:360px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:500;min-height:40px;white-space:nowrap}
.btn:hover{border-color:var(--pri)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.danger{color:var(--err)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;white-space:nowrap}
.status.err{background:var(--err-bg);color:var(--err)}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.saved{font-size:12px;color:var(--mute);margin-left:auto}
.mtabs{display:none}

/* ---------- layout ---------- */
.main{display:grid;grid-template-columns:minmax(0,44fr) minmax(0,56fr);gap:0;align-items:start}
.formcol{padding-block:18px 60px;border-right:1px solid var(--line)}
.prevcol{position:sticky;top:var(--toph,120px);height:calc(100vh - var(--toph,120px));display:flex;flex-direction:column;background:var(--desk)}

/* ---------- form ---------- */
.issues{border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.issues.err{background:var(--err-bg);border:1px solid color-mix(in srgb,var(--err) 40%,transparent)}
.issues.warn{background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.issues.ok{background:var(--ok-bg);color:var(--ok);font-weight:600}
.issues summary{cursor:pointer;font-weight:600}
.issues ul{margin:8px 0 0;padding-left:0;list-style:none;max-height:220px;overflow:auto}
.issues li{padding:3px 0}
.issues li a{color:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.issues .e{color:var(--err)}.issues .w{color:var(--warn)}
fieldset{border:1px solid var(--line);border-radius:12px;padding:6px 16px 16px;margin:0 0 16px;background:var(--bg)}
legend,.sec>summary{font:600 17px/1.3 "Source Serif 4",Georgia,serif;padding:0 6px}
details.sec{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 16px}
details.sec>summary{cursor:pointer;padding:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;margin-top:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:600;color:var(--mute)}
.f label i{color:var(--err);font-style:normal}
.f small.hint{font-size:12px;color:var(--mute)}
input,select,textarea{border:1px solid var(--line);background:var(--field);border-radius:7px;padding:8px 10px;font-size:16px;min-height:40px;width:100%}
textarea{min-height:64px;resize:vertical}
.calc{background:var(--panel);border:1px dashed var(--line);border-radius:7px;padding:8px 10px;min-height:40px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-err{border-color:var(--err)!important;background:var(--err-bg)!important;box-shadow:0 0 0 1px var(--err)}
.is-warn{border-color:var(--warn)!important;background:var(--warn-bg)!important}
.msg{font-size:12px;font-weight:600;min-height:0}
.msg:empty{display:none}
.msg.e{color:var(--err)}.msg.w{color:var(--warn)}
.flash{animation:fl 1.2s}
@keyframes fl{0%,40%{box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 50%,transparent)}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

.person{border:1px solid var(--line);border-radius:12px;margin:0 0 16px;overflow:hidden}
.person-h{display:flex;align-items:center;gap:10px;background:var(--panel);padding:10px 14px;flex-wrap:wrap}
.person-h h3{margin:0;font:600 16px/1.3 Inter,sans-serif;flex:1 1 160px}
.person-h .sub{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.person-b{padding:4px 14px 14px}
.items h4{font:600 14px/1.3 Inter,sans-serif;margin:16px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.9fr) auto;gap:6px 8px;padding:10px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--bg)}
.item .r2{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item .r2 .t{flex:2 1 120px}
.item .r2 .sm{flex:0 0 70px}
.item .r2 .st{flex:0 0 84px}
.item .r2 .calc{flex:1 1 120px;text-align:right}
.pct{position:relative;flex:0 0 74px}
.pct input{padding-right:22px}
.pct::after{content:"%";position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:14px;pointer-events:none}
.item .r2 .x{font-weight:700;color:var(--mute)}
.item .r3{grid-column:1/-1}
.item .del{border:0;background:none;color:var(--mute);cursor:pointer;font-size:20px;line-height:1;width:36px;min-height:36px;border-radius:6px}
.item .del:hover{color:var(--err);background:var(--err-bg)}
.item input,.item select{min-height:36px;padding:6px 8px}
.item .calc{min-height:36px;padding:6px 8px}
.item .msg{grid-column:1/-1}
.empty{border:1px dashed var(--line);border-radius:9px;padding:12px;color:var(--mute);font-size:14px;text-align:center}
details.manual{margin-top:12px;border:1px dashed var(--line);border-radius:9px;padding:8px 12px}
details.manual summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--pri)}
.addp{width:100%;border:2px dashed var(--line);background:none;border-radius:12px;padding:14px;font-weight:600;cursor:pointer;color:var(--pri)}
.addp:hover{border-color:var(--pri)}
.rab-mini{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.rab-mini td,.rab-mini th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.rab-mini td.n,.rab-mini th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rab-mini tfoot td{font-weight:700;border-bottom:0}

/* ---------- preview ---------- */
.ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.ptools select{width:auto;min-height:36px;padding:5px 8px;font-size:14px}
.ptools .sp{flex:1}
.pscroll{flex:1;overflow:auto;padding:18px 14px 40px}
.pages{transform-origin:top left}
.note{font-size:12px;color:var(--mute);padding:0 2px 10px}

/* ---------- dokumen (kertas) ---------- */
.dtabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg);scrollbar-width:thin}
.dtabs button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:34px}
.dtabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dtabs button span{font-weight:400;opacity:.7;margin-left:4px}
.pegtab{width:100%;border-collapse:collapse;font-size:13px}
.pegtab td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.pegtab .mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.pegwrap{max-height:280px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:0 8px}
.badge{font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--panel);color:var(--mute)}
.page{width:210mm;min-height:297mm;background:#fff;color:#000;padding:16mm 17mm;margin:0 0 18px;box-shadow:0 1px 3px rgba(0,0,0,.25);font:11.5pt/1.35 "Times New Roman",Tinos,"Liberation Serif",Times,serif;position:relative}
.paper-F4 .page{min-height:330mm}
.page.land{width:297mm;min-height:210mm}
.paper-F4 .page.land{width:330mm;min-height:215mm}
.page .logo{text-align:center;margin:0 0 2mm}
.page .logo img{width:22mm;height:auto}
.page .kop.nb,.page h2.nb{font-weight:400}
.page h2.nu{text-decoration:none}
.page .kopL{font-weight:700;line-height:1.3}
.page .frame{border:1px solid #000;padding:5mm 6mm}
.page .rule1{border-top:1px solid #000;margin:3mm 0}
.page .rule2{border-top:3px double #000;margin:2.5mm 0}
.page .kwt{font-size:20pt;font-weight:700;letter-spacing:.02em}
.page table.tn td{padding:0;vertical-align:top}
.page .meta td{padding:.4mm 1.2mm;font-size:10pt}
.page .rab th,.page .rab td{font-size:10pt;padding:1mm 1.4mm}
.page .infob .l{font-weight:700}
.page .pk{width:100%;height:100%;border-collapse:collapse}
.page .pk td{border:0;border-left:1px solid #000;padding:1mm 1.6mm;text-align:center}
.page .pk tr:first-child td{border-bottom:1px solid #000}
.page .pk td:first-child{border-left:0}
.page .vt td{padding:.4mm 1mm;vertical-align:top}
.page .vt .vl{width:30mm}
.page .visum>tbody>tr>td{width:47%}
.page .visum>tbody>tr>td.no{width:9mm}
.page .mk{display:flex;align-items:center;gap:3mm;margin-bottom:3mm;font-size:9pt}
.page .mk img{width:14mm;height:auto}
.page .sig .nm.plain{font-weight:400;text-decoration:none}
.page .rinci td{border-top:0;border-bottom:0}
.page .rinci tr.b td,.page .rinci tr:last-child td{border-top:1px solid #000;border-bottom:1px solid #000}
.page .pc{outline:none}
.editing .page .pc{outline:2px dashed #2e6f8e;outline-offset:3mm;cursor:text}
.page .edbar{position:absolute;left:0;right:0;top:-1px;transform:translateY(-100%);background:#fff4dc;color:#7a4700;font:600 12px/1.3 Inter,sans-serif;padding:6px 10px;border:1px solid #e3b25a;border-radius:6px 6px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.page.edited{margin-top:40px}
.page .edbar button{font:inherit;border:1px solid #c98a1e;background:#fff;border-radius:5px;padding:3px 8px;cursor:pointer}
.page .tag{position:absolute;top:5mm;right:8mm;font:8pt Arial,sans-serif;color:#7a8a94}
.page h2{font-size:12pt;text-align:center;margin:0 0 2mm;text-decoration:underline;letter-spacing:.02em}
.page .kop{text-align:center;font-weight:700;line-height:1.3;margin-bottom:4mm}
.page .kop.rule{border-bottom:2px solid #000;padding-bottom:2mm}
.page table{border-collapse:collapse;width:100%}
.page .info td{padding:.6mm 1mm;vertical-align:top}
.page .info td.c{width:4mm;text-align:center}
.page .info td.l{width:40mm}
.page .bd th,.page .bd td{border:1px solid #000;padding:1.2mm 1.6mm;vertical-align:top}
.page .bd th{text-align:center;font-weight:700;background:#f2f2f2}
.page .r{text-align:right;white-space:nowrap}
.page .ctr{text-align:center}
.page .b{font-weight:700}
.page .big{font-size:13pt;font-weight:700;border:1.5px solid #000;display:inline-block;padding:1.5mm 5mm;margin:2mm 0}
.page .tb{font-style:italic}
.page .sig{display:grid;gap:4mm;margin-top:6mm;page-break-inside:avoid;break-inside:avoid}
.page .sig>div{min-width:0}
.page .sp{height:18mm}
.page .sig>div{display:flex;flex-direction:column}
.page .sig .sp{height:auto;min-height:18mm;flex:1 0 auto}
.page .sig .nm{font-weight:700;text-decoration:underline}
.page .s2{grid-template-columns:1fr 1fr}
.page .s3{grid-template-columns:1fr 1fr 1fr}
.page .sR{grid-template-columns:1fr 1fr}
.page .sR>div{grid-column:2}
.page .meta{margin-left:auto;width:auto}
.page .meta td{padding:.4mm 1mm}
.page .hr{border-top:1px dashed #000;margin:6mm 0 3mm}
.page p{margin:2mm 0}
.page .spd>tbody>tr>td{border:1px solid #000;padding:1.2mm 1.6mm;vertical-align:top}
.page .spd .info td{border:0;padding:.3mm .8mm}
.page .visum{font-size:10pt}
.page .visum .sp{height:8mm}
.page .visum{font-size:10pt;line-height:1.2}
.page .spd td.no{width:7mm;text-align:center}
.page .spd td.lb{width:62mm}
.page .kosong{background:#ffe0e4;color:#b00020;font-style:italic;padding:0 1mm;border-radius:2px}
.page .small{font-size:9pt}

/* metrik cetak saat mengukur tinggi lembar */
body.ukur .pages .page{padding:0;min-height:0;font-size:11pt;line-height:1.28}
body.ukur .page .logo img{width:17mm}
body.ukur .page .sig{margin-top:4mm}
body.ukur .page .sig .sp{min-height:15mm}
body.ukur .page .sp{height:15mm}
body.ukur .page .visum .sp{height:8mm}
body.ukur .page .tag,body.ukur .page .edbar{display:none}

/* ---------- dialog & toast ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--bg);border-radius:14px;max-width:440px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg h3{margin:0 0 8px;font:600 19px/1.3 "Source Serif 4",Georgia,serif}
.dlg p{margin:0 0 16px;color:var(--mute)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:90vw}

/* ---------- responsive ---------- */
@media (max-width:1099px){
 .main{grid-template-columns:minmax(0,1fr)}
 .formcol{border-right:0}
 .prevcol{position:static;height:auto;background:var(--desk);min-height:60vh}
 .pscroll{overflow:visible}
 .mtabs{display:flex;margin-top:10px}
 .mtabs button{flex:1}
 body.v-form .prevcol{display:none}
 body.v-prev .formcol{display:none}
}
@media (max-width:600px){
 .top{position:static}
 .bar .btn{flex:1 1 auto}
 .grid{grid-template-columns:minmax(0,1fr)}
 .item{grid-template-columns:minmax(0,1fr) auto}
 .item .ur{grid-column:1/-1;grid-row:2}
 .item .r2 .eq{display:none}
 .item .r2 .calc{flex-basis:100%}
 .tot{text-align:left;flex-basis:100%}
 .saved{margin-left:0;flex-basis:100%}
}

/* ---------- cetak ---------- */
@media print{
 :root{color-scheme:light}
 body{background:#fff}
 .top,.formcol,.ptools,.dtabs,.note,.mtabs,.toast,.ov{display:none!important}
 .main{display:block}
 .prevcol{position:static;height:auto;background:#fff;display:block!important}
 body.v-form .prevcol{display:block!important}
 .pscroll{overflow:visible;padding:0}
 .pages{zoom:1!important;transform:none!important}
 .pages .page{width:auto;min-height:0!important;box-shadow:none;margin:0;padding:0;break-after:page;page-break-after:always}
 .page:last-child{break-after:auto;page-break-after:auto}
 .page .tag,.page .edbar{display:none!important}
 .pages .page.land{page:land}
 .page.edited{margin-top:0}
 .editing .page .pc{outline:none}
 .pages .page{font-size:11pt;line-height:1.28}
 .page .sig{margin-top:4mm}
 .page .sig .sp{min-height:15mm}
 .page .sp{height:15mm}
 .page h2{margin-bottom:1mm}
 .page .logo img{width:17mm}
 .page .kosong{background:none;color:#000;font-style:normal}
 .page .bd th{background:#f2f2f2;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style id="pagesize">@page{size:A4;margin:12mm 15mm}</style>
</head>
<body class="v-form">

<header class="top gut" id="top">
  <div class="top-row">
    <h1>Penyusun SPJ Perjalanan Dinas<small id="jenisKet"></small></h1>
    <div class="seg" role="group" aria-label="Jenis SPJ" id="jenisSeg"></div>
    <div class="tot"><b id="grandTotal">Rp0</b><span id="grandTb">nol rupiah</span></div>
  </div>
  <div class="bar">
    <span class="status" id="statusPill"></span>
    <button class="btn" id="btnSample" type="button">Isi Contoh Data</button>
    <button class="btn" id="btnSummary" type="button">Salin Ringkasan</button>
    <button class="btn pri" id="btnXlsx" type="button" title="Satu file .xlsx, satu sheet per lembar, nama sheet seperti file contoh">Unduh Excel (.xlsx)</button>
    <button class="btn" id="btnCsv" type="button">Export CSV RAB</button>
    <button class="btn" id="btnExport" type="button">Simpan Draf JSON</button>
    <button class="btn" id="btnImport" type="button">Muat Draf JSON</button>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
    <button class="btn danger" id="btnReset" type="button">Reset Form</button>
    <span class="saved" id="savedAt">Draf belum disimpan</span>
  </div>
  <div class="seg mtabs" role="group" aria-label="Tampilan">
    <button type="button" data-view="form" aria-pressed="true">Isi form</button>
    <button type="button" data-view="prev" aria-pressed="false" id="tabPrev">Pratinjau dokumen</button>
  </div>
</header>

<main class="main">
  <section class="formcol gut" id="form" aria-label="Form input"></section>
  <section class="prevcol" aria-label="Pratinjau dokumen">
    <div class="ptools">
      <select id="selPel" aria-label="Pelaksana"></select>
      <select id="selPaper" aria-label="Ukuran kertas">
        <option value="A4">Kertas A4</option>
        <option value="F4">Kertas F4 / Folio</option>
      </select>
      <span class="sp"></span>

function parseRp(v) {
  if (typeof v === 'number') return Math.round(v);

  if (!s) return 0;
  const neg = /^-|^\(/.test(s.replace(/^rp\s*/i, ''));
  const d = s.replace(/,\d{1,2}$/, '').replace(/[^\d]/g, '');
  return d ? (neg ? -1 : 1) * parseInt(d, 10) : 0;
}

function parseISO(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if (!m) return null;
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return isNaN(d) ? null : d;
}

function rentangID(a, b) {
  const A = parseISO(a), B = parseISO(b);
  if (!A || !B) return tglID(a) || tglID(b);

  const sameY = A.getUTCFullYear() === B.getUTCFullYear(), sameM = sameY && A.getUTCMonth() === B.getUTCMonth();
  if (sameM) return `${A.getUTCDate()} s.d. ${tglID(b)}`;

const SATUAN = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
function terbilangAngka(n) {
  n = Math.floor(Math.abs(n));
  if (n < 12) return SATUAN[n];
  if (n < 20) return terbilangAngka(n - 10) + ' belas';
  if (n < 100) return terbilangAngka(Math.floor(n / 10)) + ' puluh' + (n % 10 ? ' ' + terbilangAngka(n % 10) : '');
  if (n < 200) return 'seratus' + (n > 100 ? ' ' + terbilangAngka(n - 100) : '');
  if (n < 1000) return terbilangAngka(Math.floor(n / 100)) + ' ratus' + (n % 100 ? ' ' + terbilangAngka(n % 100) : '');
  if (n < 2000) return 'seribu' + (n > 1000 ? ' ' + terbilangAngka(n - 1000) : '');
  const skala = [[1e15, 'biliar'], [1e12, 'triliun'], [1e9, 'miliar'], [1e6, 'juta'], [1e3, 'ribu']];
  for (const [b, nama] of skala) if (n >= b) {
    const depan = Math.floor(n / b), sisa = n % b;
    return terbilangAngka(depan) + ' ' + nama + (sisa ? ' ' + terbilangAngka(sisa) : '');
  }
  return '';
}

function terbilangRp(n, gaya = 'lower') {

let S = {jenis: 'pp', data: {pp: dataKosong('pp'), sa: dataKosong('sa')}, ui: {doc: 'all', pel: 'all', paper: 'A4', view: 'form'}};
let PEGAWAI = {};   // pegawai tambahan/ubahan pengguna: nama → {nip, gol, jabatan}; null = dihapus dari daftar bawaan
function cariPegawai(nama) {
  const n = String(nama || '').trim();
  if (!n) return null;
  if (n in PEGAWAI) return PEGAWAI[n];
  const b = PEGAWAI_BAWAAN[n];
  return b ? {nip: b[0], gol: b[1], jabatan: b[2], bawaan: true} : null;
}
function daftarPegawai() {
  const all = {};
  Object.entries(PEGAWAI_BAWAAN).forEach(([n, b]) => all[n] = {nama: n, nip: b[0], gol: b[1], jabatan: b[2], bawaan: true});
  Object.entries(PEGAWAI).forEach(([n, p]) => { if (p) all[n] = {nama: n, ...p, bawaan: false}; else delete all[n]; });
  return Object.values(all).sort((a, b) => a.nama.localeCompare(b.nama, 'id'));
}
const D = () => S.data[S.jenis];
const C = () => JENIS[S.jenis];

/* =====================================================================
   3. MESIN HITUNG
   ===================================================================== */
const persenOf = it => String(it.persen ?? '').trim() === '' ? 100 : volNum(it.persen);
const tarifEfektif = it => Math.round(parseRp(it.tarif) * persenOf(it) / 100);
const jumlahItem = it => Math.round(parseRp(it.tarif) * persenOf(it) / 100 * volNum(it.vol));
const jumlahDpr = it => Math.round(parseRp(it.tarif) * volNum(it.vol) * (volNum(it.persen) / 100));
function tingkatPel(p) { return p.tingkat || golInfo(p.gol)?.tingkat || ''; }

function hitung(d = D(), cfg = C()) {
  const k = d.k;
  const sel = selisihHari(k.tglBerangkat, k.tglKembali);
  const lamaAuto = sel === null || sel < 0 ? null : sel + 1;
  const lama = volNum(k.lamaManual) > 0 ? Math.round(volNum(k.lamaManual)) : lamaAuto;
  const rabCols = cfg.rab(k), gaya = k.gayaTerbilang || cfg.terbilang;
  const pel = d.pel.map(p => {
    const items = p.items.map(it => ({...it, jumlah: jumlahItem(it)}));
    const total = items.reduce((a, b) => a + b.jumlah, 0);
    const perKat = {};
    items.forEach(it => perKat[it.kat] = (perKat[it.kat] || 0) + it.jumlah);
    const volKat = {};
    items.forEach(it => volKat[it.kat] = (volKat[it.kat] || 0) + volNum(it.vol));
    const dpr = (p.dpr || []).map(it => ({...it, jumlah: jumlahDpr(it)}));
    const dprTotal = dpr.reduce((a, b) => a + b.jumlah, 0);
    const dibayar = String(p.dibayar ?? '').trim() === '' ? total : parseRp(p.dibayar);
    // data perjalanan per orang: kosong = ikut data kegiatan (edit manual untuk peserta kab/kota)
    const tBer = p.tglBerangkat || k.tglBerangkat, tKem = p.tglKembali || k.tglKembali;
    const selP = selisihHari(tBer, tKem);
    const lamaP = p.tglBerangkat || p.tglKembali ? (selP === null || selP < 0 ? null : selP + 1) : lama;
    const trip = {asal: p.kotaAsal || k.kotaAsal, tujuan: p.kotaTujuan || k.kotaTujuan, berangkat: tBer, kembali: tKem, lama: lamaP,
      perintah: p.pemberiPerintah || k.pemberiPerintah, alat: p.alatAngkut || k.alatAngkut};
    // kolom RAB: kategori yang tidak dipetakan masuk "Lain-lain"
    const mapped = new Set(rabCols.flatMap(c => c.kat));
    const rab = rabCols.map(c => c.kat.reduce((a, kk) => a + (perKat[kk] || 0), 0));
    const lain = Object.entries(perKat).filter(([kk]) => !mapped.has(kk)).reduce((a, [, v]) => a + v, 0);
    return {...p, items, total, perKat, volKat, dpr, dprTotal, dibayar, sisa: total - dibayar, rab, lain, trip};
  });
  const total = pel.reduce((a, p) => a + p.total, 0);
  const rabTot = rabCols.map((_, i) => pel.reduce((a, p) => a + p.rab[i], 0));
  const lainTot = pel.reduce((a, p) => a + p.lain, 0);
  return {k, lama, lamaAuto, rabCols, gaya, pel, total, rabTot, lainTot};
}

/** Penerima uang gabungan: salah satu pelaksana atau orang lain (isian manual). */
function penerimaGab(k, pel) {
  if (k.penerima === 'manual') return {nama: k.penerimaNama, nip: k.penerimaNip};
  const p = pel.find(x => x.id === k.penerima) || pel[0];
  return p ? {nama: p.nama, nip: p.nip} : {nama: '', nip: ''};
}

/* =====================================================================
   4. VALIDASI (tidak mengunci; hanya menandai)
   ===================================================================== */
function validasi(H, cfg = C()) {
  const out = [], k = H.k;
  const add = (lvl, id, msg, slot) => out.push({lvl, id, msg, slot});
  const nipOk = v => String(v).replace(/\D/g, '').length === 18;
  const thnNow = new Date().getFullYear();
  const label = id => SEKSI.flatMap(s => s.fields).find(f => f.id === id)?.l || id;

  WAJIB_KEG.forEach(id => { if (!String(k[id] ?? '').trim()) add('e', 'k-' + id, `${label(id)} wajib diisi.`); });
  ['ppkNip', 'bppNip'].forEach(id => { if (k[id] && !nipOk(k[id])) add('w', 'k-' + id, `${label(id)} tidak 18 digit.`); });

  ['tglBerangkat', 'tglKembali', 'tglST', 'tglSPD', 'tglKuitansi'].forEach(id => {
    const d = parseISO(k[id]);
    if (k[id] && !d) add('e', 'k-' + id, `${label(id)} tidak valid.`);
    else if (d && (d.getUTCFullYear() < thnNow - 2 || d.getUTCFullYear() > thnNow + 1)) add('w', 'k-' + id, `${label(id)} tahun ${d.getUTCFullYear()} tampak tidak wajar.`);
  });
  const sel = selisihHari(k.tglBerangkat, k.tglKembali);
  if (sel !== null && sel < 0) add('e', 'k-tglKembali', 'Tanggal kembali lebih awal dari tanggal berangkat.');
  if (sel !== null && sel > 30) add('w', 'k-tglKembali', `Lama perjalanan ${sel + 1} hari, periksa kembali tanggalnya.`);
  if (selisihHari(k.tglST, k.tglBerangkat) < 0) add('w', 'k-tglST', 'Surat Tugas bertanggal setelah tanggal berangkat.');
  if (k.tglSPD && selisihHari(k.tglSPD, k.tglBerangkat) < 0) add('w', 'k-tglSPD', 'SPD bertanggal setelah tanggal berangkat.');
  if (selisihHari(k.tglKembali, k.tglKuitansi) < 0) add('w', 'k-tglKuitansi', 'Tanggal kuitansi sebelum tanggal kembali.');
  const dk = parseISO(k.tglKuitansi);
  if (dk && [0, 6].includes(dk.getUTCDay())) add('w', 'k-tglKuitansi', 'Tanggal kuitansi jatuh di akhir pekan.');
  if (H.lama && H.lamaAuto && H.lama !== H.lamaAuto) add('w', 'k-lamaManual', `Lama diisi ${H.lama} hari, padahal dari tanggal ${H.lamaAuto} hari.`);
  if (k.penerima !== 'manual' && H.pel.length && !penerimaGab(k, H.pel).nama.trim()) add('e', 'k-penerima', 'Nama penerima SPBy/kwitansi penutup masih kosong.');
  if (k.penerima === 'manual') {
    if (!k.penerimaNama.trim()) add('e', 'k-penerimaNama', 'Nama penerima uang gabungan wajib diisi.');
    if (!k.penerimaNip.trim()) add('e', 'k-penerimaNip', 'NIP penerima uang gabungan wajib diisi.');
    else if (!nipOk(k.penerimaNip)) add('w', 'k-penerimaNip', 'NIP penerima tidak 18 digit.');
  }

  if (!H.pel.length) add('e', null, 'Belum ada pelaksana perjalanan dinas.');
  const namaSeen = {};
  H.pel.forEach((p, i) => {
    const who = p.nama || `Pelaksana ${i + 1}`, pf = `p-${p.id}-`;
    if (!p.nama.trim()) add('e', pf + 'nama', `Pelaksana ${i + 1}: nama wajib diisi.`);
    else if (namaSeen[p.nama.trim().toLowerCase()]) add('w', pf + 'nama', `${who}: nama tercatat dua kali.`);
    namaSeen[p.nama.trim().toLowerCase()] = 1;
    if (!p.nip.trim()) { if (p.gol === '-') add('w', pf + 'nip', `${who}: tanpa NIP (non-PNS), pastikan memang benar.`); else add('e', pf + 'nip', `${who}: NIP wajib diisi.`); }
    else if (p.gol !== '-' && !nipOk(p.nip)) add('w', pf + 'nip', `${who}: NIP tidak 18 digit.`);
    if (!p.gol) add('e', pf + 'gol', `${who}: golongan wajib dipilih.`);
    if (!p.jabatan.trim()) add('e', pf + 'jabatan', `${who}: jabatan wajib diisi.`);
    if (!p.items.length) add('e', null, `${who}: belum ada rincian biaya.`);
    p.items.forEach((it, j) => {
      const ip = `i-${it.id}-`, slot = `msg-i-${it.id}`, nm = `${who}, biaya ${j + 1}`;
      if (!String(it.uraian).trim()) add('e', ip + 'uraian', `${nm}: uraian kosong.`, slot);
      const t = parseRp(it.tarif), v = volNum(it.vol);
      if (String(it.tarif ?? '').trim() === '' || t === 0) add('e', ip + 'tarif', `${nm}: tarif masih 0.`, slot);
      else if (t < 0) add('e', ip + 'tarif', `${nm}: tarif bernilai negatif.`, slot);
      if (String(it.vol ?? '').trim() === '' || v === 0) add('e', ip + 'vol', `${nm}: volume masih 0.`, slot);
      else if (v < 0) add('e', ip + 'vol', `${nm}: volume bernilai negatif.`, slot);
      const ps = persenOf(it);
      if (ps <= 0 || ps > 100) add('e', ip + 'persen', `${nm}: persentase harus 1 s.d. 100.`, slot);
    });
    const L = p.trip.lama;
    if (L) {
      if ((p.volKat.uh || 0) > L) add('w', null, `${who}: uang harian ${fmtVol(p.volKat.uh)} hari melebihi lama perjalanan ${L} hari.`);
      if ((p.volKat.inap || 0) > Math.max(L - 1, 1)) add('w', null, `${who}: penginapan ${fmtVol(p.volKat.inap)} malam melebihi ${Math.max(L - 1, 1)} malam.`);
      if ((p.volKat.sewa || 0) > L) add('w', null, `${who}: sewa kendaraan melebihi lama perjalanan.`);
    }
    const sp = selisihHari(p.trip.berangkat, p.trip.kembali);
    if ((p.tglBerangkat || p.tglKembali) && sp !== null && sp < 0) add('e', pf + 'tglKembali', `${who}: tanggal kembali lebih awal dari tanggal berangkat.`);
    if ((p.tglBerangkat || p.tglKembali) && selisihHari(p.trip.kembali, k.tglKuitansi) < 0) add('w', pf + 'tglKembali', `${who}: tanggal kuitansi sebelum tanggal kembali orang ini.`);
    if (cfg.dpr) p.dpr.forEach((it, j) => {
      const ip = `d-${it.id}-`, slot = `msg-d-${it.id}`, nm = `${who}, DPR ${j + 1}`;
      if (!String(it.uraian).trim()) add('e', ip + 'uraian', `${nm}: uraian kosong.`, slot);
      if (parseRp(it.tarif) <= 0) add('e', ip + 'tarif', `${nm}: tarif 0 atau negatif.`, slot);
      if (volNum(it.vol) <= 0) add('e', ip + 'vol', `${nm}: volume 0 atau negatif.`, slot);
      if (volNum(it.persen) <= 0 || volNum(it.persen) > 100) add('e', ip + 'persen', `${nm}: persentase harus 1 s.d. 100.`, slot);
      const batas = p.perKat[it.kat] || 0;
      const dprKat = p.dpr.filter(x => x.kat === it.kat).reduce((a, b) => a + b.jumlah, 0);
      if (dprKat > batas) add('w', ip + 'tarif', `${nm}: nilai DPR ${KATEGORI[it.kat].label.toLowerCase()} (${rp(dprKat)}) melebihi rincian (${rp(batas)}).`, slot);
    });
    if (p.items.length && p.total <= 0) add('e', null, `${who}: total biaya masih Rp0.`);
    if (String(p.dibayar ?? '').trim() !== '' && parseRp(p.dibayar) < 0) add('e', pf + 'dibayar', `${who}: nilai dibayar semula negatif.`);
  });
  if (H.pel.length && H.total <= 0) add('e', null, 'Total keseluruhan masih Rp0.');
  return out;
}

function tandai(issues) {
  $$('.is-err,.is-warn').forEach(el => el.classList.remove('is-err', 'is-warn'));
  $$('.msg').forEach(el => { el.textContent = ''; el.className = 'msg'; });
  const slotTxt = {};
  issues.forEach(is => {
    const el = is.id && document.getElementById(is.id);
    if (el && !el.classList.contains('is-err')) el.classList.add(is.lvl === 'e' ? 'is-err' : 'is-warn');
    const slot = document.getElementById(is.slot || ('msg-' + is.id));
    if (slot) {
      const msg = is.slot ? is.msg.replace(/^[^:]+:\s*/, '') : is.msg;
      slotTxt[slot.id] = (slotTxt[slot.id] ? slotTxt[slot.id] + ' ' : '') + msg;
      slot.textContent = slotTxt[slot.id];
      slot.className = 'msg ' + (slot.classList.contains('e') || is.lvl === 'e' ? 'e' : 'w');
    }
  });
  const ne = issues.filter(i => i.lvl === 'e').length, nw = issues.length - ne;
  const pill = $('#statusPill');
  pill.className = 'status ' + (ne ? 'err' : nw ? 'warn' : 'ok');
  pill.textContent = ne ? `Draf · ${ne} wajib/salah` + (nw ? ` · ${nw} peringatan` : '') : nw ? `${nw} peringatan` : 'Siap cetak';
  const box = $('#issues');
  if (!box) return;
  if (!issues.length) { box.className = 'issues ok'; box.innerHTML = 'Semua isian lengkap dan angka masuk akal. Dokumen siap dicetak.'; return; }
  box.className = 'issues ' + (ne ? 'err' : 'warn');
  box.innerHTML = `<details${issues.length <= 6 ? ' open' : ''}><summary>${ne ? `${ne} isian wajib kosong atau salah` : ''}${ne && nw ? ' dan ' : ''}${nw ? `${nw} peringatan` : ''}. Total tetap dihitung; perbaiki sebelum cetak final.</summary>
    <ul>${issues.map((is, n) => `<li class="${is.lvl}">${is.lvl === 'e' ? '●' : '▲'} ${is.id ? `<a data-go="${esc(is.id)}">${esc(is.msg)}</a>` : esc(is.msg)}</li>`).join('')}</ul></details>`;
}

const kop = (k, extra = [], rule = false) => `<div class="kop${rule ? ' rule' : ''}">${[k.kementerian || KOP_KEMENTERIAN, ...extra].map(esc).join('<br>')}</div>`;

function buatDokumen(H, cfg) {
  const k = H.k, g = cfg.nip, J = cfg.judul, tb = n => esc(terbilangRp(n, H.gaya));
  const PP = cfg.id === 'pp';
  const tahun = parseISO(k.tglKuitansi)?.getUTCFullYear() || '';
  const tglKw = tglID(k.tglKuitansi), kotaTgl = `${PH(k.kotaTtd, 'Kota')}, ${PH(tglKw, 'tanggal')}`;
  const unit = PH(k.unitPPK, 'Unit kerja PPK');
  const sig = (atas, nama, nip, garis = false) => sigBlock(atas, nama, nip, g, garis);
  const ttdPPK = (atas = ['a.n. Kuasa Pengguna Anggaran'], garis = false) => sig([...atas, 'Pejabat Pembuat Komitmen', unit], k.ppkNama, k.ppkNip, garis);
  const ttdBPP = atas => sig([...atas, 'Bendahara Pengeluaran Pembantu'], k.bppNama, k.bppNip);
  const noSPD = k.noSPD || k.noST, tglSPD = k.tglSPD || k.tglST;
  const rangka = PH(k.maksud, 'Maksud perjalanan dinas');
  const rpD = n => PP ? `${rp(n)},-` : rp(n);           // PP rincian: "Rp740.000,-"
  const kopKem = (extra = []) => `<div class="kop">${[k.kementerian || KOP_KEMENTERIAN, ...extra].map(esc).join('<br>')}</div>`;
  const docs = [];
  const tag = t => `<div class="tag">${esc(t)}</div>`;
  const push = (o) => docs.push({land: false, ...o, sheet: o.title.split(' · ')[0], id: `${o.key}-${o.pel || 'gab'}`});

  /* ---------- 1. RAB gabungan (lanskap) ---------- */
  const showLain = H.lainTot !== 0;
  const tglRAB = p => [PH(tglID(p.trip.berangkat), '…'), PH(tglID(p.trip.kembali), '…')];
  push({key: 'rab', pel: null, land: true, title: J.rab, html: `${tag(J.rab)}
    <h2 class="nu">${PP ? 'RINCIAN BIAYA PERJALANAN DINAS' : 'RINCIAN BIAYA PERJALANAN DINAS'}</h2><br>
    <div class="infob">${info([['Unit/Bidang', PH(k.unitBidang || k.unitPPK, 'Unit/Bidang')], ['Topik', rangka], ['Tujuan', PH(k.kotaTujuan, 'Tujuan')], ['Tanggal', PH(rentangID(k.tglBerangkat, k.tglKembali), 'Tanggal')], ['MAK', esc(k.mak)]])}</div><br>
    <table class="bd rab"><thead><tr><th style="width:8mm">No</th><th>NAMA / Kegiatan</th><th>Tujuan</th><th>Tgl Berangkat</th><th>Tgl Pulang</th>${H.rabCols.map(c => `<th>${esc(c.label)}</th>`).join('')}${showLain ? '<th>Lain-lain</th>' : ''}<th>TOTAL</th></tr></thead>
    <tbody>${H.pel.map((p, i) => `<tr><td class="ctr">${i + 1}</td><td>${PH(p.nama, 'Nama')}</td><td>${PH(p.trip.tujuan, '…')}</td><td>${tglRAB(p)[0]}</td><td>${tglRAB(p)[1]}</td>${p.rab.map(v => `<td class="r">${v ? rp(v) : '-'}</td>`).join('')}${showLain ? `<td class="r">${p.lain ? rp(p.lain) : '-'}</td>` : ''}<td class="r">${rp(p.total)}</td></tr>`).join('')}
    <tr class="b"><td colspan="5" class="r">Jumlah</td>${H.rabTot.map(v => `<td class="r">${rp(v)}</td>`).join('')}${showLain ? `<td class="r">${rp(H.lainTot)}</td>` : ''}<td class="r">${rp(H.total)}</td></tr></tbody></table>
    <div class="sig sR">${ttdPPK()}</div>`});

  /* ---------- 2. SPBy ---------- */
  const spby = (pel, title, jumlah, kepada) => push({key: 'spby', pel, title, land: true, html: `${tag(title)}
    ${PP ? '' : logo()}
    <div class="kop">${[k.kementerian || KOP_KEMENTERIAN, k.deputi, PP ? (k.unitPPK || '').toUpperCase() : ''].filter(Boolean).map(esc).join('<br>')}</div>
    <h2>SURAT PERINTAH BAYAR</h2>
    <table class="tn"><tr><td style="width:50%;text-align:right;padding-right:12mm">Tanggal :</td><td>Nomor :</td></tr></table>
    <div class="rule2"></div>
    <p>Saya yang bertanda tangan di bawah ini selaku Pejabat Pembuat Komitmen memerintahkan ${PP ? 'kepada ' : ''}Bendahara Pengeluaran Pembantu agar melakukan pembayaran sejumlah :</p>
    <div class="big">${rp(jumlah)}</div>
    <div class="rule2"></div>
    ${info([['Terbilang', `<span class="tb">${tb(jumlah)}</span>`]])}
    <div class="rule2"></div>
    ${info([['Kepada', PH(kepada.nama, 'Nama penerima')], ['Untuk pembayaran', rangka]])}<br>
    ${info([[PP ? 'Dibebankan Kepada' : 'Dibebankan pada', PH(k.dibebankan || k.dipa, 'DIPA')], ['Kegiatan, output, MAK', esc(k.mak)], ['Kode', esc(k.mak)]])}
    <div class="rule2"></div>
    <div class="sig s3">
      ${ttdBPP([PP ? kotaTgl : '', PP ? 'Lunas di bayar,' : 'Setuju/lunas dibayar ,', '', ''])}
      ${sig([PP ? kotaTgl : '', 'Diterima,', PP ? 'Penerima Uang/Uang Muka' : 'Penerima Uang', '', ''], kepada.nama, kepada.nip)}
      ${ttdPPK([kotaTgl, PP ? 'An. Kuasa Pengguna Anggaran' : 'a.n. Kuasa Pengguna Anggaran'])}
    </div>`});
  const pg = penerimaGab(k, H.pel);
  if (cfg.spby === 'gabungan') spby(null, J.spby, H.total, pg);

  /* ---------- Kuitansi (per orang & penutup) ---------- */
  const kuitansi = (key, pel, title, judul, jumlah, penerima) => {
    const penutup = key === 'penutup';
    const dari = `Kuasa Pengguna Anggaran ${PH(k.dipa, 'DIPA')}${k.satker ? '<br>' + esc(k.satker) : ''}`;
    if (PP) {
      const rows = penutup
        ? [['Sudah Terima dari', dari], ['Banyaknya Uang', `<b>${rp(jumlah)}</b>`], ['Untuk Pembayaran', rangka]]

function ringkasanTeks() {
  const H = hitung(), cfg = C(), k = H.k;
  const L = [];
  L.push(`RINGKASAN ${cfg.nama.toUpperCase()} (Perjalanan Dinas)`);
  L.push(`Maksud     : ${k.maksud || '-'}`);
  L.push(`Tujuan     : ${k.kotaTujuan || '-'}${k.provinsi ? ', ' + k.provinsi : ''} (dari ${k.kotaAsal || '-'})`);
  L.push(`Tanggal    : ${rentangID(k.tglBerangkat, k.tglKembali) || '-'}${H.lama ? ` (${H.lama} hari)` : ''}`);
  L.push(`Surat Tugas: ${k.noST || '-'} tgl ${tglID(k.tglST) || '-'}`);
  L.push(`MAK / DIPA : ${k.mak || '-'} / ${k.dipa || '-'}`);
  L.push('');
  H.pel.forEach((p, i) => {
    L.push(`${i + 1}. ${p.nama || '(nama kosong)'} | ${p.nip || '-'} | ${pangkatGol(p.gol) || '-'} | Tingkat ${tingkatPel(p) || '-'}`);
    p.items.forEach(it => L.push(`   - ${it.uraian}: ${rp(parseRp(it.tarif))}${persenOf(it) !== 100 ? ' x ' + fmtVol(persenOf(it)) + '%' : ''} x ${fmtVol(it.vol)} ${it.satuan} = ${rp(it.jumlah)}${it.ket ? ' (' + it.ket + ')' : ''}`));
    if (p.dpr.length) L.push(`   DPR: ${p.dpr.map(d => `${d.uraian} ${rp(d.jumlah)}`).join('; ')}`);
    L.push(`   Subtotal: ${rp(p.total)}`);
  });
  L.push('');
  H.rabCols.forEach((c, i) => L.push(`${c.label.padEnd(16)}: ${rp(H.rabTot[i])}`));
  if (H.lainTot) L.push(`${'Lain-lain'.padEnd(16)}: ${rp(H.lainTot)}`);
  L.push(`TOTAL           : ${rp(H.total)}`);
  L.push(`Terbilang       : ${terbilangRp(H.total, H.gaya)}`);
  const ne = lastIssues.filter(i => i.lvl === 'e').length;
  if (lastIssues.length) L.push('', `Catatan: ${ne} isian wajib/salah, ${lastIssues.length - ne} peringatan belum diselesaikan.`);
  return L.join('\n');
}
async function salin(text, html) {
  try {
    if (html && window.ClipboardItem && navigator.clipboard?.write) {
      await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html], {type: 'text/html'}), 'text/plain': new Blob([text], {type: 'text/plain'})})]);
      return true;
    }
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove();
    return ok;
  }
}

function petaLembar(pg) {

function kluster(vals, tol) {
  const v = [...vals].sort((a, b) => a - b), out = [];
  v.forEach(x => { if (!out.length || x - out[out.length - 1] > tol) out.push(x); });
  return out;
}
const idxDekat = (arr, x) => { let b = 0; arr.forEach((v, i) => { if (Math.abs(v - x) < Math.abs(arr[b] - x)) b = i; }); return b; };
function lembarKeSheet(wb, pg, d, nama, imgCache) {
  const O = pg.getBoundingClientRect();
  const {leaves, boxes, imgs} = petaLembar(pg);
  const rel = r => ({l: r.left - O.left, r: r.right - O.left, t: r.top - O.top, b: r.bottom - O.top});
  const L = leaves.map(x => ({...x, ...rel({left: x.l, right: x.r, top: x.t, bottom: x.b})})), B = boxes.map(x => ({...x, ...rel(x.r)}));
  const W = O.width, Hh = Math.max(O.height, ...L.map(x => x.b), ...B.map(x => x.b), 1);
  const xs = kluster([0, W, ...L.flatMap(x => [x.l, x.r]), ...B.flatMap(x => [x.l, x.r])].map(v => Math.max(0, Math.min(W, v))), 3);
  const ys = kluster([0, Hh + 2, ...L.flatMap(x => [x.t, x.b]), ...B.flatMap(x => [x.t, x.b])].map(v => Math.max(0, v)), 1.5);
  const ws = wb.addWorksheet(nama, {views: [{showGridLines: false}], properties: {defaultRowHeight: 15}});
  for (let i = 0; i < xs.length - 1; i++) { const px = xs[i + 1] - xs[i]; ws.getColumn(i + 1).width = Math.max(.1, px < 12 ? px / 12 : (px - 5) / 7); }
  for (let i = 0; i < ys.length - 1; i++) ws.getRow(i + 1).height = Math.max(1, (ys[i + 1] - ys[i]) * .75);
  const nC = xs.length - 1, nR = ys.length - 1;
  const span = (a, b, arr, n) => { const i = Math.min(idxDekat(arr, a), n - 1); return [i, Math.max(i, Math.min(n - 1, idxDekat(arr, b) - 1))]; };
  const pakai = new Set();
  L.forEach(x => {
    const [c1, c2] = span(x.l, x.r, xs, nC), [r1, r2] = span(x.t, x.b, ys, nR);
    let bebas = true;
    for (let r = r1; r <= r2 && bebas; r++) for (let c = c1; c <= c2; c++) if (pakai.has(r + ',' + c)) { bebas = false; break; }
    if (!bebas && pakai.has(r1 + ',' + c1)) return;
    const cell = ws.getCell(r1 + 1, c1 + 1);
    if (bebas) { for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) pakai.add(r + ',' + c); if (r2 > r1 || c2 > c1) ws.mergeCells(r1 + 1, c1 + 1, r2 + 1, c2 + 1); }
    else pakai.add(r1 + ',' + c1);
    const teks = x.runs.map(r => r.text).join('');
    const sama = x.runs.every(r => JSON.stringify(r.font) === JSON.stringify(x.runs[0].font));
    const m = /^(-?)Rp([\d.]+)(,-)?$/.exec(teks.trim());
    if (m && sama) { cell.value = (m[1] ? -1 : 1) * parseInt(m[2].replace(/\./g, ''), 10); cell.numFmt = `"Rp"#,##0${m[3] ? '",-"' : ''};-"Rp"#,##0${m[3] ? '",-"' : ''}`; }
    else cell.value = sama ? teks : {richText: x.runs};
    cell.font = x.runs[0].font;
    cell.alignment = {horizontal: x.align, vertical: x.valign, wrapText: true};
    if (x.fill) { const c = x.fill.match(/\d+/g).slice(0, 3).map(n => (+n).toString(16).padStart(2, '0')).join('').toUpperCase(); cell.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF' + c}}; }
  });
  const garis = (r, c, sd, st) => { const cell = ws.getCell(r + 1, c + 1); cell.border = {...(cell.border || {}), [sd]: {style: st}}; };
  B.forEach(x => {
    const [c1, c2] = span(x.l, x.r, xs, nC), r1 = Math.min(idxDekat(ys, x.t), nR - 1), r2 = Math.max(r1, Math.min(nR - 1, idxDekat(ys, x.b) - 1));
    const s = x.sides;
    if (s.top) for (let c = c1; c <= c2; c++) garis(r1, c, 'top', s.top);
    if (s.bottom) { const rb = x.b - x.t < 2 ? r1 : r2; for (let c = c1; c <= c2; c++) garis(rb, c, x.b - x.t < 2 && !s.top ? 'top' : 'bottom', s.bottom); }
    if (s.left) for (let r = r1; r <= r2; r++) garis(r, c1, 'left', s.left);
    if (s.right) for (let r = r1; r <= r2; r++) garis(r, c2, 'right', s.right);

    const pos = (arr, v, n) => { let i = 0; while (i < n - 1 && arr[i + 1] <= v) i++; return i + Math.min(1, Math.max(0, (v - arr[i]) / ((arr[i + 1] - arr[i]) || 1))); };
    ws.addImage(imgCache.get(src), {tl: {col: pos(xs, q.l, nC), row: pos(ys, q.t, nR)}, ext: {width: q.r - q.l, height: q.b - q.t}, editAs: 'oneCell'});
  });

    horizontalCentered: true, printArea: `A1:${colHuruf(nC)}${nR}`, margins: {left: .59, right: .59, top: .47, bottom: .47, header: .2, footer: .2}};

}
/** Sheet isian di depan (seperti "Data Pegawai" / "Isian Perjadin" di file contoh). */
function sheetIsian(wb, H, cfg) {
  const ws = wb.addWorksheet(cfg.sheetData, {views: [{showGridLines: true}]});
  const k = H.k, f = {name: 'Times New Roman', size: 11}, fb = {...f, bold: true};
  const tipis = {top: {style: 'thin'}, left: {style: 'thin'}, bottom: {style: 'thin'}, right: {style: 'thin'}};
  ws.columns = [{width: 5}, {width: 36}, {width: 24}, {width: 22}, {width: 44}, {width: 10}, {width: 16}];
  ws.addRow([`${cfg.nama.toUpperCase()} · PERJALANAN DINAS`]).font = {...fb, size: 13};
  const kv = [['Maksud', k.maksud], ['Tempat berangkat', k.kotaAsal], ['Tujuan', [k.kotaTujuan, k.provinsi].filter(Boolean).join(', ')], ['Tanggal', rentangID(k.tglBerangkat, k.tglKembali)], ['Lama', H.lama ? H.lama + ' hari' : ''],
    ['Surat Tugas', `${k.noST || ''}${k.tglST ? ' tgl ' + tglID(k.tglST) : ''}`], ['DIPA', k.dipa], ['MAK', k.mak], ['PPK', `${k.ppkNama} (NIP ${k.ppkNip})`], ['Bendahara', `${k.bppNama} (NIP ${k.bppNip})`], ['Unit', k.unitPPK]];
  kv.forEach(([a, b]) => { const r = ws.addRow(['', a, b || '']); r.font = f; ws.mergeCells(r.number, 3, r.number, 7); r.getCell(2).font = fb; });
  ws.addRow([]);
  const hd = ws.addRow(['No', 'Nama', 'NIP', 'Pangkat/Golongan', 'Jabatan', 'Tingkat', 'Jumlah']);
  hd.eachCell(c => { c.font = fb; c.border = tipis; c.alignment = {horizontal: 'center', vertical: 'middle', wrapText: true}; c.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FFF2F2F2'}}; });
  H.pel.forEach((p, i) => {
    const r = ws.addRow([i + 1, p.nama, p.nip ? nipSpasi(p.nip.replace(/\D/g, '')) : '-', pangkatGol(p.gol), p.jabatan, tingkatPel(p), p.total]);
    r.eachCell({includeEmpty: true}, c => { c.font = f; c.border = tipis; c.alignment = {vertical: 'top', wrapText: true}; });
    r.getCell(7).numFmt = '"Rp"#,##0';
  });
  const t = ws.addRow(['', 'JUMLAH', '', '', '', '', H.total]);
  t.eachCell({includeEmpty: true}, c => { c.font = fb; c.border = tipis; });
  t.getCell(7).numFmt = '"Rp"#,##0';
  ws.addRow(['', 'Terbilang', terbilangRp(H.total, H.gaya)]).font = {...f, italic: true};
  ws.pageSetup = {paperSize: S.ui.paper === 'F4' ? 14 : 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0};
}
async function eksporExcel() {
  const btn = $('#btnXlsx'), teks = btn.textContent;
  btn.disabled = true; btn.textContent = 'Menyusun Excel…';
  const host = document.createElement('div');
  try {
    if (!window.ExcelJS) await muatSkrip(EXCELJS_URL);
    const H = hitung(), cfg = C(), docs = buatDokumen(H, cfg);
    const wb = new ExcelJS.Workbook();
    wb.creator = 'Penyusun SPJ Perjalanan Dinas'; wb.created = new Date();
    sheetIsian(wb, H, cfg);
    const mm = 96 / 25.4, [pw, ph] = S.ui.paper === 'F4' ? [215, 330] : [210, 297];
    host.className = 'pages';
    host.style.cssText = 'position:fixed;left:-20000px;top:0;zoom:1;pointer-events:none';
    document.body.appendChild(host);
    document.body.classList.add('ukur');
    const pakai = new Set(), cache = new Map();
    for (const d of docs) {
      let nm = String(d.sheet || d.title).replace(/[\[\]:*?\/\\]/g, '-').slice(0, 31), n = 2;
      while (pakai.has(nm.toLowerCase())) nm = `${String(d.sheet).slice(0, 27)} (${n++})`;
      pakai.add(nm.toLowerCase());
      host.innerHTML = `<div class="page${d.land ? ' land' : ''}" style="width:${((d.land ? ph : pw) - 30) * mm}px"><div class="pc">${d.html}</div></div>`;
      lembarKeSheet(wb, host.firstElementChild, d, nm, cache);
    }
    const buf = await wb.xlsx.writeBuffer();
    const nb = String(H.k.namaBerkas || H.k.kotaTujuan || 'Perjalanan Dinas').replace(/[\\\/:*?"<>|]+/g, ' ').trim();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download = cfg.namaFile(nb);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    window.SPJ_lastXlsx = buf;
    toast(`${a.download} diunduh (${docs.length + 1} sheet)`);
  } catch (e) {
    console.error(e);
    toast('Gagal membuat Excel: ' + (e.message || e));
  } finally {
    host.remove(); document.body.classList.remove('ukur');
    btn.disabled = false; btn.textContent = teks;
  }
}
